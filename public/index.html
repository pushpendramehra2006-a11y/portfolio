<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animated Circuit Traces Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: #172033; background: #f8fafc; isolation: isolate; font-family: Arial, sans-serif; }
    #particle-background { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
    header { padding: 22px 6%; display: flex; gap: 16px; align-items: center; background: rgba(255,255,255,.92); border-bottom: 1px solid #e2e8f0; }
    .mark { width: 60px; height: 60px; display: grid; place-items: center; background: #29496f; color: white; border-radius: 16px; font-weight: 800; }
    h1 { font-size: clamp(17px, 2vw, 25px); font-weight: 500; margin: 0; color: #071a35; }
    header p { color: #64748b; margin: 6px 0 0; font-size: 14px; }
    main { width: min(900px, calc(100% - 36px)); margin: 70px auto; }
    .card { padding: 32px; border: 1px solid #e2e8f0; border-radius: 18px; background: rgba(255,255,255,.92); box-shadow: 0 14px 40px rgba(27,45,72,.055); }
    .card h2 { margin-top: 0; }
    .card p { color: #667085; line-height: 1.8; }
  </style>
</head>
<body>
  <canvas id="particle-background" aria-hidden="true"></canvas>
  <header>
    <div class="mark" aria-hidden="true">MBM</div>
    <div><h1>MBM UNIVERSITY, JODHPUR</h1><p>Electronics &amp; Communication Dept.</p></div>
  </header>
  <main><section class="card"><h2>Animated Circuit Traces</h2><p>Standalone preview of the circuit background. Copy <code>circuit-animation.js</code> into your portfolio's <code>public</code> folder and follow the README instructions.</p></section></main>
  <script src="circuit-animation.js"></script>
</body>
</html>
