<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    
    <!-- BACKGROUND VIDEO LOOP -->
    <video autoplay muted loop playsinline id="bg-video">
        <source src="bg-video.mp4" type="video/mp4">
    </video>

    <!-- LOGIN MODAL -->
    <div id="userModal" class="user-modal">
        <div class="modal-content">
            <h2>Enter Your Details</h2>
            <form id="loginForm">
                <input type="text" id="userName" placeholder="Full Name" required>
                <input type="email" id="userEmail" placeholder="Email ID" required>
                <input type="text" id="userYear" placeholder="Year (e.g. 3rd Year)" required>
                <input type="text" id="userBranch" placeholder="Branch (e.g. ECE / CSE)" required>
                <input type="text" id="userSpecialization" placeholder="Tech Specialization (e.g. React / C++)" required>
                <button type="submit" class="btn primary-btn" style="width: 100%; margin-top: 1rem;">Submit & View Portfolio</button>
            </form>
        </div>
    </div>

    <div class="glass-wrapper">
        <!-- Navbar -->
        <header>
            <nav class="navbar">
                <div class="logo">PORTFOLIO<span>.</span></div>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#skills">Skills</a></li>
                    <li><a href="#projects">Projects</a></li>
                    <li><a href="admin.html" target="_blank" style="color: var(--accent-color);"><i class="fas fa-table"></i> Users Table</a></li>
                </ul>
                <button id="openLoginBtn" class="btn secondary-btn" style="padding: 0.5rem 1.2rem; font-size: 0.9rem; margin-left: 1rem;">Login / Switch</button>
                <div class="menu-btn"><i class="fas fa-bars"></i></div>
            </nav>
        </header>

        <!-- Hero Section -->
        <section id="home" class="hero">
            <div class="hero-content">
                <p class="greeting">Hi, I am</p>
                <h1 id="dynamic-name">Pushpendra <span>Mehra</span></h1>
                <h2 class="typing-text" id="dynamic-role">Full-Stack Developer</h2>
                <p class="hero-desc" id="dynamic-desc">I build scalable web applications, create seamless solutions, and write robust code.</p>
                <div class="hero-buttons">
                    <a href="#projects" class="btn primary-btn">View My Work</a>
                </div>
            </div>
            <div class="hero-image">
                <div class="image-wrapper">
                    <img id="dynamic-avatar" src="profile.png" alt="Profile">
                </div>
            </div>
        </section>

        <!-- Dynamic Skills Section -->
        <section id="skills" class="skills-section">
            <h2 class="section-title">Technical <span>Expertise</span></h2>
            <div class="skills-grid" id="dynamic-skills-grid">
                <!-- Dynamically populated based on user specialization -->
            </div>
        </section>

        <footer class="glass-footer">
            <p>&copy; 2026 Dynamic Portfolio System.</p>
        </footer>
    </div>

    <style>
        .user-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95); z-index: 9999;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content {
            background: rgba(255, 255, 255, 0.05); padding: 3rem;
            border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px); width: 400px; text-align: center;
        }
        .modal-content input {
            width: 100%; padding: 0.8rem; margin: 0.5rem 0; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.1); color: #fff;
        }
        .modal-content h2 { color: #fff; margin-bottom: 1rem; }
    </style>

    <script src="script.js"></script>
</body>
</html>
