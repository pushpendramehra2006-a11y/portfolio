<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - User Database</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; padding: 3rem; }
        h1 { margin-bottom: 1rem; color: #ff7a6c; }
        table { width: 100%; border-collapse: collapse; margin-top: 2rem; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px); border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
        th { background: rgba(255, 122, 108, 0.2); color: #ff7a6c; font-weight: 600; }
        tr:hover { background: rgba(255,255,255,0.08); }
        .back-btn { display: inline-block; margin-bottom: 1rem; padding: 0.5rem 1rem; background: #ff7a6c; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">&larr; Back to Portfolio</a>
    <h1>Registered Users Database (Tabular Format)</h1>
    <p>List of all users who logged in and generated their customized portfolios.</p>
    
    <table id="userTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email ID</th>
                <th>Year</th>
                <th>Branch</th>
                <th>Tech Specialization</th>
                <th>Login Date & Time</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>

    <script>
        fetch('http://localhost:5000/api/users')
            .then(res => res.json())
            .then(users => {
                const tbody = document.querySelector('#userTable tbody');
                tbody.innerHTML = '';
                if(users.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">No users registered yet.</td></tr>`;
                    return;
                }
                users.forEach(u => {
                    tbody.innerHTML += `<tr>
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.year}</td>
                        <td>${u.branch}</td>
                        <td><strong>${u.specialization}</strong></td>
                        <td>${new Date(u.createdAt).toLocaleString()}</td>
                    </tr>`;
                });
            })
            .catch(err => {
                console.error('Error fetching users:', err);
                document.querySelector('#userTable tbody').innerHTML = `<tr><td colspan="6" style="text-align:center; color: #ff7a6c;">Failed to connect to backend server.</td></tr>`;
            });
    </script>
</body>
</html>
